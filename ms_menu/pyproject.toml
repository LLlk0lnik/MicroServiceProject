[project]
name = "ms-menu"
version = "0.1.0"
description = ""
authors = [
    {name = "LLlk0lnik",email = "94215708+LLlk0lnik@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "fastapi (>=0.137.0,<0.138.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "greenlet (>=3.5.1,<4.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-black (>=0.4.0,<0.5.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "aioredis (>=2.0.1,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "ms_menu", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
